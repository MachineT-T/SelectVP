[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "selectvp"
version = "0.1.0"
description = "Training-free video moment retrieval by selecting visual prompts"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6,<7"]

[project.optional-dependencies]
inference = ["torch>=2.4", "torchvision>=0.19", "transformers==4.57.1", "accelerate>=1.0,<2", "opencv-python>=4.8", "numpy>=1.24,<3", "Pillow>=9", "av>=12"]
preprocessing = ["scipy>=1.10", "scikit-learn>=1.3", "qwen-vl-utils==0.0.14"]

[project.scripts]
selectvp = "selectvp.cli:main"

[tool.setuptools]
license-files = ["THIRD_PARTY_NOTICES.md"]

[tool.setuptools.packages.find]
include = ["selectvp*"]
